<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner Ambient Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Finance Card / Wallet Illustration -->
  <g filter="url(#shadow)" transform="translate(64, 100)">
    <!-- Back Wallet Flap / Envelope -->
    <rect x="16" y="24" width="352" height="236" rx="36" fill="#1d4ed8" stroke="#3b82f6" stroke-width="4"/>
    
    <!-- Front Credit/Debit Card -->
    <rect x="0" y="64" width="384" height="240" rx="32" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Card Chip / Brand Strip -->
    <rect x="36" y="104" width="54" height="42" rx="8" fill="#fbbf24"/>
    <line x1="36" y1="125" x2="90" y2="125" stroke="#d97706" stroke-width="2"/>
    <line x1="63" y1="104" x2="63" y2="146" stroke="#d97706" stroke-width="2"/>

    <!-- Contactless wave lines -->
    <path d="M120 114 A16 16 0 0 1 120 136" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M128 108 A26 26 0 0 1 128 142" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Card Number Mock / Balance Line -->
    <rect x="36" y="180" width="160" height="12" rx="6" fill="#1e293b"/>
    <circle cx="330" cy="240" r="24" fill="#ef4444" fill-opacity="0.9"/>
    <circle cx="304" cy="240" r="24" fill="#f59e0b" fill-opacity="0.9"/>
    
    <!-- Balance Coin Indicator -->
    <circle cx="340" cy="80" r="32" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
    <path d="M333 80 L347 80 M340 73 L340 87" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
